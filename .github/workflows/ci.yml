# Public/fork-PR CI for agent-tracer.
#
# RUNNER: GitHub-hosted `ubuntu-24.04` (fixed image, not `ubuntu-latest`).
# This repo is public and the org runner group has
# `allows_public_repositories: false`, so no self-hosted runner can serve it;
# public UnityInFlow repos run on GitHub-hosted runners (free for public repos).
# This job is secretless (`contents: read`), so fork PRs are safe here.
# Secret-bearing work (GHCR push + GH Release) lives in release.yml, also
# GitHub-hosted, triggered only by tag pushes forks cannot fire.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # GitHub-hosted, secretless (see top-of-file comment).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # GitHub-hosted runners ship native Docker, so the ClickHouse
      # Testcontainers integration tests run for real here — the deferred
      # Phase-2/3 ITs are finally observed in CI (RESEARCH Pattern 1 bonus).
      - name: Build + test (incl. ClickHouse Testcontainers ITs)
        run: ./gradlew build

      # The action inspects the PR diff and comments on the PR — it hard-fails on
      # non-PR events ("This action only works on pull_request events"), so gate it.
      # The ecosystem requirement is lint-on-every-PR (agent-tracer CLAUDE.md, June 2026).
      - name: Spec compliance (dogfood Tool 04)
        if: github.event_name == 'pull_request'
        uses: UnityInFlow/spec-ci-plugin@d3069c440946b5ea8da8e52fcda83697c7409f01 # v1.1.1
