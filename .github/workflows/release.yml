# Release automation for agent-tracer (the OPS-01 template instantiation for
# this milestone's repos).
#
# Secret-bearing (GITHUB_TOKEN with contents/packages write): fork PRs cannot
# push v*.*.* tags, so this job never runs untrusted fork code.
# RUNNER: GitHub-hosted `ubuntu-24.04`. The repo is public and the org runner
# group has `allows_public_repositories: false`, so no self-hosted runner can
# serve it; the former `orangepi` release runner no longer exists.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write    # for creating the GH Release
  packages: write    # for ghcr.io push

# Serialize release runs per tag and never cancel one mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # GitHub-hosted X64. The images stay multi-arch without QEMU: the builder
    # stage runs on $BUILDPLATFORM and the runtime stage has no RUN step.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # docker-container driver: multi-platform manifest capable (D-06).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push tracer image (multi-arch, QEMU-free)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/tracer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/unityinflow/agent-tracer:${{ steps.version.outputs.version }}
            ghcr.io/unityinflow/agent-tracer:latest

      - name: Build and push demo-emitter image (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/emitter.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/unityinflow/agent-tracer-demo-emitter:${{ steps.version.outputs.version }}
            ghcr.io/unityinflow/agent-tracer-demo-emitter:latest

      # Host-arch-aware verification (v0.1.0 precedent): never docker-run the
      # non-host (arm64) variant on this X64 host — inspect the pushed manifests instead.
      - name: Verify multi-arch manifests
        run: |
          set -euo pipefail
          for image in ghcr.io/unityinflow/agent-tracer ghcr.io/unityinflow/agent-tracer-demo-emitter; do
            docker buildx imagetools inspect "${image}:${{ steps.version.outputs.version }}" | tee manifest.txt
            grep -q 'linux/amd64' manifest.txt
            grep -q 'linux/arm64' manifest.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: agent-tracer ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            agent-tracer **${{ github.ref_name }}** released.

            ## Quickstart (pulls released GHCR images only — D-07)

            ```bash
            git clone https://github.com/UnityInFlow/agent-tracer
            cd agent-tracer
            docker compose -f docker/compose.yaml up
            ```

            Then open http://localhost:8080 — the demo-emitter seeds traces on cold start.

            See the auto-generated notes below for changes since the previous release.
